[campus_notifier]
# Set ansible_host to this account's Terraform public IP. Keep private keys out
# of this shared inventory; load the matching key into ssh-agent instead.
nairobi_pulse ansible_host=REPLACE_WITH_TERRAFORM_PUBLIC_IP ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3

[database]
# Replace with this account's `terraform -chdir=terraform output -raw database_public_ip`.
database_box ansible_host=REPLACE_WITH_DATABASE_PUBLIC_IP ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3
